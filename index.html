<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Tab icons (under /mahjong/) -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />

    <!--
      iOS Home Screen: Safari often probes the DOMAIN ROOT, not the /mahjong/
      subpath. Icons are hosted at https://sszettella.github.io/apple-touch-icon.png
      (user Pages site). Absolute root URLs make Add to Home Screen reliable.
    -->
    <link rel="apple-touch-icon" href="https://sszettella.github.io/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="https://sszettella.github.io/apple-touch-icon-180x180.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="https://sszettella.github.io/apple-touch-icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="https://sszettella.github.io/apple-touch-icon-120x120.png" />
    <link rel="apple-touch-icon-precomposed" href="https://sszettella.github.io/apple-touch-icon-precomposed.png" />
    <!-- Fallbacks under /mahjong/ if root is unavailable -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1a3d32" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mahjong" />
    <meta name="application-name" content="Mahjong" />
    <meta name="description" content="Mahjong Solitaire — 100 levels, no ads. Works offline." />
    <title>Mahjong Solitaire</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
