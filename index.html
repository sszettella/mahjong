<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Cache-bust ?v= so Safari/Chrome drop stale icons when you re-add to Home Screen.
      Full-bleed PNGs (no pre-rounded corners) — iOS applies its own mask.
    -->
    <link rel="icon" href="/favicon.ico?v=3" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=3" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=3" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png?v=3" />

    <!-- iPhone / iPad home screen — Safari uses these when you Add to Home Screen -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" sizes="180x180" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-167.png?v=3" sizes="167x167" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-152.png?v=3" sizes="152x152" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-120.png?v=3" sizes="120x120" />
    <link rel="apple-touch-icon" href="/pwa-192.png?v=3" sizes="192x192" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1a3d32" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mahjong" />
    <meta name="application-name" content="Mahjong" />
    <meta name="description" content="Mahjong Solitaire — 100 levels, no ads. Classic tile matching for iPhone." />
    <title>Mahjong Solitaire</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
